      // Stash invite/reset link details before the sign-in library clears them from the URL.
      try {
        if (location.pathname === '/auth/callback' && location.hash.length > 1) {
          sessionStorage.setItem('hi_auth_cb_hash', location.hash.substring(1));
        }
      } catch (e) {}
    </script>
